name: examples

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  index:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: INDEX.md mentions every example
        run: |
          status=0
          for dir in [0-9][0-9]-*/; do
            [ -d "$dir" ] || continue
            grep -q "${dir%/}" INDEX.md || { echo "INDEX.md: no row for ${dir%/}"; status=1; }
          done
          exit $status
      - name: Shell scripts pass shellcheck
        run: shellcheck lab/*.sh [0-9][0-9]-*/run.sh

  # The whole lab, started from nothing the way a reader would.
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start the lab
        run: lab/up.sh
      - name: lab/check.sh reports nothing missing
        run: lab/check.sh
      - name: A pipeline runs end to end
        run: lab/smoke.sh
      - name: Every example prints what its entry says
        run: |
          status=0
          for dir in [0-9][0-9]-*/; do
            echo "== ${dir%/}"
            "${dir}run.sh" | diff "${dir}expected.txt" - || status=1
          done
          exit $status
