# The lab for the IaC controller series: GitLab CE, one GitLab Runner and
# Semaphore UI on one Docker network. Start it with lab/up.sh, which also
# creates the passwords and tokens in lab/.env, which Compose reads; stop it
# with lab/down.sh.
name: iac-lab

services:
  gitlab:
    image: gitlab/gitlab-ce:19.5.1-ce.0
    hostname: gitlab
    ports:
      - "127.0.0.1:8929:80"
    environment:
      GITLAB_ROOT_PASSWORD: ${GITLAB_ROOT_PASSWORD:?run lab/up.sh, which sets it}
      # A lab, not production: no monitoring stack, few workers, so it fits
      # in about 3 GB of memory.
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab'
        nginx['listen_port'] = 80
        prometheus_monitoring['enable'] = false
        puma['worker_processes'] = 2
        sidekiq['concurrency'] = 5
        gitlab_rails['usage_ping_enabled'] = false
    volumes:
      - gitlab-config:/etc/gitlab
      - gitlab-data:/var/opt/gitlab
    shm_size: 256m

  runner:
    image: gitlab/gitlab-runner:v19.5.1
    depends_on: [gitlab]
    volumes:
      - runner-config:/etc/gitlab-runner
      # The Docker executor starts each job as a sibling container on the
      # host's Docker daemon.
      - /var/run/docker.sock:/var/run/docker.sock

  semaphore:
    image: semaphoreui/semaphore:v2.19.17
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: admin
      SEMAPHORE_ADMIN_NAME: Admin
      SEMAPHORE_ADMIN_EMAIL: admin@lab.invalid
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD:?run lab/up.sh, which sets it}
    volumes:
      - semaphore-data:/var/lib/semaphore
      - semaphore-config:/etc/semaphore

volumes:
  gitlab-config:
  gitlab-data:
  runner-config:
  semaphore-data:
  semaphore-config:

networks:
  default:
    name: iac-lab
